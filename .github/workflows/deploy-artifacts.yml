name: Deploy Artifacts Pipeline

on:
  workflow_call:

jobs:
  rebundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Download frontend assets
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: ./frontend-dist

      - name: Download backend JAR
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: ./backend-jar

      - name: Make rebundle script executable
        run: chmod +x ci/rebundle.sh

      - name: Rebundle JAR using script
        run: |
          # Find the JAR file
          JAR_FILE=$(find ./backend-jar -name "*-runner.jar" | head -1)

          # Use our rebundle script
          ./ci/rebundle.sh "$JAR_FILE" ./frontend-dist ./app.jar

      - name: Upload combined JAR
        uses: actions/upload-artifact@v4
        with:
          name: combined-jar
          path: ./app.jar
          retention-days: 30

      - name: Rename combined JAR
        if: github.ref_type == 'tag'
        run: mv ./app.jar ./app-${{ github.ref_name }}.jar

      - name: Upload JAR to release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v1
        with:
          files: ./app-${{ github.ref_name }}.jar
          name: ${{ github.ref_name }}

  build_image:
    runs-on: ubuntu-latest
    needs: [rebundle]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download combined JAR
        uses: actions/download-artifact@v4
        with:
          name: combined-jar
          path: ./app.jar

      - name: Determine version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="DEV-SNAPSHOT"
          fi
          echo "Detected version: $VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          file: ci/Dockerfile
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/module324:latest
            ghcr.io/${{ github.repository_owner }}/module324:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
